<!DOCTYPE html>
<html lang='ja'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>店舗情報登録</title>
</head>
<body>
  <h1>店舗情報登録</h1>
  <p>店舗の情報を入力してください。</p>
  <form id='storeForm'>
    <label for='storeName'>店舗名:</label>
    <input type='text' id='storeName' name='storeName'><br><br>

    <label for='companyName'>運営会社:</label>
    <input type='text' id='companyName' name='companyName'><br><br>

    <label for='address'>住所:</label>
    <input type='text' id='address' name='address'><br><br>

    <label for='url'>店舗URL:</label>
    <input type='text' id='url' name='url'><br><br>

    <label for='recommendedItem'>おすすめ品:</label>
    <input type='text' id='recommendedItem' name='recommendedItem'><br><br>

    <label for='agreement'>利用規約に同意:</label>
    <input type='checkbox' id='agreement' name='agreement' required><br><br>

    <button type='submit'>登録</button>
  </form>

  <a href='agent_registration.html'><button>戻る</button></a>
  <a href='store_work_page1.html'><button>次へ</button></a>
</body>
</html>
