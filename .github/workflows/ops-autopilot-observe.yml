name: ops-autopilot-observe

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-autopilot-observe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: apicius-6bcae
      REGION: asia-northeast1
      SERVICE: ssrapicius6bcae
      VERIFY_WORKFLOW_FILE: verify-approval-hash.yml
      EXPECTED_RUNTIME_SA: sa-ssr-runtime@apicius-6bcae.iam.gserviceaccount.com
      RUNTIME_SA_EMAIL: sa-ssr-runtime@apicius-6bcae.iam.gserviceaccount.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Collect Evidence And Classify
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          TS="$(date -u +%Y%m%d-%H%M%S)"
          OUT="artifacts/ops-autopilot/${TS}"
          mkdir -p "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

          fail=0
          warn=0
          FAIL_REASONS="$OUT/fail-reasons.txt"
          WARN_REASONS="$OUT/warn-reasons.txt"
          : > "$FAIL_REASONS"
          : > "$WARN_REASONS"
          echo "[INFO] output=$OUT"

          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > "$OUT/run-service.json" || {
              fail=1
              echo "[FAIL] run service describe failed" > "$OUT/run-service.error.txt"
              echo "run_service_describe_failed" >> "$FAIL_REASONS"
            }

          gcloud functions list \
            --project "$PROJECT_ID" \
            --v2 \
            --regions "$REGION" \
            --format="table(name,buildConfig.runtime,serviceConfig.serviceAccountEmail)" > "$OUT/functions-v2.txt" || {
              fail=1
              echo "[FAIL] functions list failed" > "$OUT/functions-v2.error.txt"
              echo "functions_list_failed" >> "$FAIL_REASONS"
            }

          if gcloud alpha firestore fields ttls list --project "$PROJECT_ID" --format=json > "$OUT/firestore-ttls.json" 2>/dev/null; then
            :
          elif gcloud beta firestore fields ttls list --project "$PROJECT_ID" --format=json > "$OUT/firestore-ttls.json" 2>/dev/null; then
            :
          else
            warn=1
            echo "[]" > "$OUT/firestore-ttls.json"
            echo "[WARN] ttl list unavailable" > "$OUT/firestore-ttls.warn.txt"
            echo "ttl_list_unavailable" >> "$WARN_REASONS"
          fi

          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > "$OUT/project-iam.json" || {
            fail=1
            echo "[FAIL] project iam read failed" > "$OUT/project-iam.error.txt"
            echo "project_iam_read_failed" >> "$FAIL_REASONS"
          }

          jq -r '.bindings[] | select(.role=="roles/editor" or .role=="roles/owner") | .role + " => " + (.members|join(", "))' \
            "$OUT/project-iam.json" > "$OUT/project-iam-editor-owner.txt" || true

          gcloud projects get-iam-policy "$PROJECT_ID" --format=json \
            | jq -r '.bindings[] | select(.role=="roles/secretmanager.secretAccessor") | .members[]' \
            > "$OUT/secret-accessor-project.txt" || true

          cat > "$OUT/required-secrets.txt" <<'EOF'
          GATE_TOKEN_SECRET
          OWNER_API_TOKEN
          TELEMETRY_SALT_SECRET
          STRIPE_SECRET_KEY
          STRIPE_WEBHOOK_SECRET
          BILLING_SUCCESS_URL
          BILLING_CANCEL_URL
          EOF
          sort -u "$OUT/required-secrets.txt" -o "$OUT/required-secrets.txt"

          if gcloud secrets list --project "$PROJECT_ID" --format='value(name)' > "$OUT/secret-names.txt" 2>/dev/null; then
            : > "$OUT/secret-accessor-runtime-sa.txt"
            while IFS= read -r secret_name; do
              [ -z "$secret_name" ] && continue
              if gcloud secrets get-iam-policy "$secret_name" --project "$PROJECT_ID" --format=json > "$OUT/secret-${secret_name}.json" 2>/dev/null; then
                jq -r --arg m "serviceAccount:${RUNTIME_SA_EMAIL}" --arg s "$secret_name" '
                  .bindings[]? | select(.role=="roles/secretmanager.secretAccessor")
                  | select(any(.members[]?; . == $m))
                  | $s
                ' "$OUT/secret-${secret_name}.json" >> "$OUT/secret-accessor-runtime-sa.txt" || true
              else
                warn=1
                echo "secret_policy_read_failed_${secret_name}" >> "$WARN_REASONS"
              fi
            done < "$OUT/secret-names.txt"
            sort -u "$OUT/secret-accessor-runtime-sa.txt" -o "$OUT/secret-accessor-runtime-sa.txt" || true

            comm -23 "$OUT/required-secrets.txt" "$OUT/secret-accessor-runtime-sa.txt" > "$OUT/missing-required-secret-accessor.txt" || true
            comm -13 "$OUT/required-secrets.txt" "$OUT/secret-accessor-runtime-sa.txt" > "$OUT/extra-runtime-secret-accessor.txt" || true
          else
            warn=1
            echo "secret_list_failed" >> "$WARN_REASONS"
            : > "$OUT/secret-accessor-runtime-sa.txt"
            : > "$OUT/missing-required-secret-accessor.txt"
            : > "$OUT/extra-runtime-secret-accessor.txt"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${VERIFY_WORKFLOW_FILE}/runs?per_page=10" \
            > "$OUT/gh-verify-runs.json" || {
              fail=1
              echo '{"workflow_runs":[]}' > "$OUT/gh-verify-runs.json"
              echo "[FAIL] cannot read verify workflow runs" > "$OUT/gh-verify-runs.error.txt"
              echo "verify_workflow_runs_read_failed" >> "$FAIL_REASONS"
            }

          jq -r '.workflow_runs[] | [.id,.status,.conclusion,.created_at] | @tsv' \
            "$OUT/gh-verify-runs.json" > "$OUT/gh-verify-runs.txt" || true

          service_url="$(jq -r '.status.url // empty' "$OUT/run-service.json" || true)"
          if [ -z "$service_url" ]; then
            fail=1
            echo "[FAIL] service url missing" > "$OUT/smoke.error.txt"
            echo "service_url_missing" >> "$FAIL_REASONS"
          else
            code="$(curl -sS -o "$OUT/smoke-body.txt" -D "$OUT/smoke-headers.txt" -w "%{http_code}" "$service_url" || true)"
            echo "$code" > "$OUT/smoke-status.txt"
            if [ "$code" != "200" ]; then
              fail=1
              echo "smoke_http_${code}" >> "$FAIL_REASONS"
            fi
          fi

          runtime_sa="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$OUT/run-service.json" || true)"
          echo "$runtime_sa" > "$OUT/runtime-sa.txt"
          if [ "$runtime_sa" != "$EXPECTED_RUNTIME_SA" ]; then
            fail=1
            echo "runtime_sa_mismatch" >> "$FAIL_REASONS"
          fi
          if echo "$runtime_sa" | grep -q 'compute@developer.gserviceaccount.com'; then
            fail=1
            echo "runtime_sa_default_compute_detected" >> "$FAIL_REASONS"
          fi

          success_count="$(jq -r '[.workflow_runs[]? | select(.conclusion=="success")] | length' "$OUT/gh-verify-runs.json" 2>/dev/null || echo 0)"
          if ! [[ "$success_count" =~ ^[0-9]+$ ]]; then
            success_count=0
          fi
          if [ "$success_count" -lt 1 ]; then
            fail=1
            echo "verify_workflow_success_count_zero" >> "$FAIL_REASONS"
          fi

          for key in nonces partner_nonces owner_rate_limit; do
            if ! jq -e --arg k "$key" 'tostring | test($k)' "$OUT/firestore-ttls.json" >/dev/null 2>&1; then
              warn=1
              echo "ttl_missing_${key}" >> "$WARN_REASONS"
            fi
          done

          if [ -s "$OUT/project-iam-editor-owner.txt" ]; then
            warn=1
            echo "project_has_editor_or_owner_bindings" >> "$WARN_REASONS"
          fi
          if [ -s "$OUT/secret-accessor-project.txt" ]; then
            warn=1
            echo "project_has_secret_accessor_bindings" >> "$WARN_REASONS"
          fi
          if [ -s "$OUT/missing-required-secret-accessor.txt" ]; then
            fail=1
            echo "required_secret_accessor_missing" >> "$FAIL_REASONS"
          fi
          if [ -s "$OUT/extra-runtime-secret-accessor.txt" ]; then
            warn=1
            echo "runtime_sa_has_extra_secret_accessor" >> "$WARN_REASONS"
          fi

          WARN_CATEGORIES="$OUT/warn-categories.txt"
          FAIL_CATEGORIES="$OUT/fail-categories.txt"
          : > "$WARN_CATEGORIES"
          : > "$FAIL_CATEGORIES"

          while IFS= read -r reason; do
            [ -z "$reason" ] && continue
            case "$reason" in
              ttl_*)
                echo "WARN_TTL" >> "$WARN_CATEGORIES"
                ;;
              project_has_editor_or_owner_bindings)
                echo "WARN_EDITOR_OWNER" >> "$WARN_CATEGORIES"
                ;;
              runtime_sa_has_extra_secret_accessor|project_has_secret_accessor_bindings)
                echo "WARN_OPTIONAL_SECRET_EXTRA" >> "$WARN_CATEGORIES"
                ;;
              runtime_sa_drift)
                echo "WARN_RUNTIME_DRIFT" >> "$WARN_CATEGORIES"
                ;;
              *)
                echo "WARN_UNKNOWN" >> "$WARN_CATEGORIES"
                ;;
            esac
          done < "$WARN_REASONS"

          while IFS= read -r reason; do
            [ -z "$reason" ] && continue
            case "$reason" in
              required_secret_accessor_missing)
                echo "ERROR_SECRET_REQUIRED_MISSING" >> "$FAIL_CATEGORIES"
                ;;
              run_service_describe_failed|functions_list_failed|project_iam_read_failed|verify_workflow_runs_read_failed|service_url_missing|smoke_http_*|runtime_sa_mismatch|runtime_sa_default_compute_detected|verify_workflow_success_count_zero)
                echo "ERROR_RUNTIME_OR_OBSERVE" >> "$FAIL_CATEGORIES"
                ;;
              *)
                echo "ERROR_UNKNOWN" >> "$FAIL_CATEGORIES"
                ;;
            esac
          done < "$FAIL_REASONS"

          sort -u "$WARN_CATEGORIES" -o "$WARN_CATEGORIES"
          sort -u "$FAIL_CATEGORIES" -o "$FAIL_CATEGORIES"

          WARN_TTL_COUNT="$(grep -c '^WARN_TTL$' "$WARN_CATEGORIES" || true)"
          WARN_EDITOR_OWNER_COUNT="$(grep -c '^WARN_EDITOR_OWNER$' "$WARN_CATEGORIES" || true)"
          WARN_OPTIONAL_SECRET_EXTRA_COUNT="$(grep -c '^WARN_OPTIONAL_SECRET_EXTRA$' "$WARN_CATEGORIES" || true)"
          WARN_RUNTIME_DRIFT_COUNT="$(grep -c '^WARN_RUNTIME_DRIFT$' "$WARN_CATEGORIES" || true)"
          WARN_UNKNOWN_COUNT="$(grep -c '^WARN_UNKNOWN$' "$WARN_CATEGORIES" || true)"
          WARN_TOTAL="$((WARN_TTL_COUNT + WARN_EDITOR_OWNER_COUNT + WARN_OPTIONAL_SECRET_EXTRA_COUNT + WARN_RUNTIME_DRIFT_COUNT + WARN_UNKNOWN_COUNT))"
          ERROR_TOTAL="$(wc -l < "$FAIL_REASONS" | tr -d ' ')"

          status="OK"
          if [ "$fail" -eq 1 ]; then
            status="FAIL"
          elif [ "$warn" -eq 1 ]; then
            status="WARN"
          fi
          echo "$status" > "$OUT/status.txt"

          {
            echo "# Ops Autopilot Observe"
            echo
            echo "- Status: $status"
            echo "- Project: $PROJECT_ID"
            echo "- Region: $REGION"
            echo "- Service: $SERVICE"
            echo "- Runtime SA: $runtime_sa"
            echo "- Verify success count (last 10): $success_count"
            if [ -s "$OUT/secret-accessor-runtime-sa.txt" ]; then
              echo "- Runtime SA secret bindings:"
              sed 's/^/  - /' "$OUT/secret-accessor-runtime-sa.txt"
            else
              echo "- Runtime SA secret bindings: (none)"
            fi
            if [ -s "$OUT/missing-required-secret-accessor.txt" ]; then
              echo "- Missing required runtime secret bindings:"
              sed 's/^/  - /' "$OUT/missing-required-secret-accessor.txt"
            fi
            if [ -s "$OUT/extra-runtime-secret-accessor.txt" ]; then
              echo "- Extra runtime secret bindings:"
              sed 's/^/  - /' "$OUT/extra-runtime-secret-accessor.txt"
            fi
            echo
            echo "## Fail Reasons"
            if [ -s "$FAIL_REASONS" ]; then
              sed 's/^/- /' "$FAIL_REASONS"
            else
              echo "- (none)"
            fi
            echo
            echo "## Warn Reasons"
            if [ -s "$WARN_REASONS" ]; then
              sed 's/^/- /' "$WARN_REASONS"
            else
              echo "- (none)"
            fi
            echo
            echo "## Counters"
            echo "- WARN total: $WARN_TOTAL"
            echo "- ERROR total: $ERROR_TOTAL"
            echo "- WARN_TTL: $WARN_TTL_COUNT"
            echo "- WARN_EDITOR_OWNER: $WARN_EDITOR_OWNER_COUNT"
            echo "- WARN_OPTIONAL_SECRET_EXTRA: $WARN_OPTIONAL_SECRET_EXTRA_COUNT"
            echo "- WARN_RUNTIME_DRIFT: $WARN_RUNTIME_DRIFT_COUNT"
            echo "- WARN_UNKNOWN: $WARN_UNKNOWN_COUNT"
            echo
            echo "## Machine Metrics"
            echo "METRIC WARN_TOTAL=$WARN_TOTAL"
            echo "METRIC ERROR_TOTAL=$ERROR_TOTAL"
            echo "METRIC WARN_TTL=$WARN_TTL_COUNT"
            echo "METRIC WARN_EDITOR_OWNER=$WARN_EDITOR_OWNER_COUNT"
            echo "METRIC WARN_OPTIONAL_SECRET_EXTRA=$WARN_OPTIONAL_SECRET_EXTRA_COUNT"
            echo "METRIC WARN_RUNTIME_DRIFT=$WARN_RUNTIME_DRIFT_COUNT"
            echo "METRIC WARN_UNKNOWN=$WARN_UNKNOWN_COUNT"
            echo
            echo "## Next CLI"
            echo "1. gcloud run services describe $SERVICE --project $PROJECT_ID --region $REGION --format='value(spec.template.spec.serviceAccountName)'"
            echo "2. gcloud functions list --project $PROJECT_ID --v2 --regions $REGION --format='table(name,buildConfig.runtime,serviceConfig.serviceAccountEmail)'"
            echo "3. gh run list --workflow $VERIFY_WORKFLOW_FILE --limit 5"
          } > "$OUT/summary.md"

          if [ "$status" = "FAIL" ]; then
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$status" = "WARN" ]; then
            echo "status=WARN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=OK" >> "$GITHUB_OUTPUT"

      - name: Upload Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-autopilot-observe-${{ github.run_id }}
          path: ${{ steps.classify.outputs.out }}
          if-no-files-found: error
          retention-days: 30
