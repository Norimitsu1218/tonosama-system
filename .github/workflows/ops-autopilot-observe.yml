name: ops-autopilot-observe

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: ops-autopilot-observe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: apicius-6bcae
      REGION: asia-northeast1
      SERVICE: ssrapicius6bcae
      VERIFY_WORKFLOW_FILE: verify-approval-hash.yml
      EXPECTED_RUNTIME_SA: sa-ssr-runtime@apicius-6bcae.iam.gserviceaccount.com
      RUNTIME_SA_EMAIL: sa-ssr-runtime@apicius-6bcae.iam.gserviceaccount.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Collect Evidence And Classify
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          TS="$(date -u +%Y%m%d-%H%M%S)"
          OUT="artifacts/ops-autopilot/${TS}"
          mkdir -p "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

          fail=0
          warn=0
          FAIL_REASONS="$OUT/fail-reasons.txt"
          WARN_REASONS="$OUT/warn-reasons.txt"
          : > "$FAIL_REASONS"
          : > "$WARN_REASONS"
          echo "[INFO] output=$OUT"

          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > "$OUT/run-service.json" || {
              fail=1
              echo "[FAIL] run service describe failed" > "$OUT/run-service.error.txt"
              echo "run_service_describe_failed" >> "$FAIL_REASONS"
            }

          gcloud functions list \
            --project "$PROJECT_ID" \
            --v2 \
            --regions "$REGION" \
            --format="table(name,buildConfig.runtime,serviceConfig.serviceAccountEmail)" > "$OUT/functions-v2.txt" || {
              fail=1
              echo "[FAIL] functions list failed" > "$OUT/functions-v2.error.txt"
              echo "functions_list_failed" >> "$FAIL_REASONS"
            }

          if gcloud alpha firestore fields ttls list --project "$PROJECT_ID" --format=json > "$OUT/firestore-ttls.json" 2>/dev/null; then
            :
          elif gcloud beta firestore fields ttls list --project "$PROJECT_ID" --format=json > "$OUT/firestore-ttls.json" 2>/dev/null; then
            :
          else
            warn=1
            echo "[]" > "$OUT/firestore-ttls.json"
            echo "[WARN] ttl list unavailable" > "$OUT/firestore-ttls.warn.txt"
            echo "ttl_list_unavailable" >> "$WARN_REASONS"
          fi

          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > "$OUT/project-iam.json" || {
            fail=1
            echo "[FAIL] project iam read failed" > "$OUT/project-iam.error.txt"
            echo "project_iam_read_failed" >> "$FAIL_REASONS"
          }

          jq -r '.bindings[] | select(.role=="roles/editor" or .role=="roles/owner") | .role + " => " + (.members|join(", "))' \
            "$OUT/project-iam.json" > "$OUT/project-iam-editor-owner.txt" || true

          gcloud projects get-iam-policy "$PROJECT_ID" --format=json \
            | jq -r '.bindings[] | select(.role=="roles/secretmanager.secretAccessor") | .members[]' \
            > "$OUT/secret-accessor-project.txt" || true

          cat > "$OUT/required-secrets.txt" <<'EOF'
          GATE_TOKEN_SECRET
          OWNER_API_TOKEN
          TELEMETRY_SALT_SECRET
          STRIPE_SECRET_KEY
          STRIPE_WEBHOOK_SECRET
          BILLING_SUCCESS_URL
          BILLING_CANCEL_URL
          EOF
          sort -u "$OUT/required-secrets.txt" -o "$OUT/required-secrets.txt"

          if gcloud secrets list --project "$PROJECT_ID" --format='value(name)' > "$OUT/secret-names.txt" 2>/dev/null; then
            : > "$OUT/secret-accessor-runtime-sa.txt"
            while IFS= read -r secret_name; do
              [ -z "$secret_name" ] && continue
              if gcloud secrets get-iam-policy "$secret_name" --project "$PROJECT_ID" --format=json > "$OUT/secret-${secret_name}.json" 2>/dev/null; then
                jq -r --arg m "serviceAccount:${RUNTIME_SA_EMAIL}" --arg s "$secret_name" '
                  .bindings[]? | select(.role=="roles/secretmanager.secretAccessor")
                  | select(any(.members[]?; . == $m))
                  | $s
                ' "$OUT/secret-${secret_name}.json" >> "$OUT/secret-accessor-runtime-sa.txt" || true
              else
                warn=1
                echo "secret_policy_read_failed_${secret_name}" >> "$WARN_REASONS"
              fi
            done < "$OUT/secret-names.txt"
            sort -u "$OUT/secret-accessor-runtime-sa.txt" -o "$OUT/secret-accessor-runtime-sa.txt" || true

            comm -23 "$OUT/required-secrets.txt" "$OUT/secret-accessor-runtime-sa.txt" > "$OUT/missing-required-secret-accessor.txt" || true
            comm -13 "$OUT/required-secrets.txt" "$OUT/secret-accessor-runtime-sa.txt" > "$OUT/extra-runtime-secret-accessor.txt" || true
          else
            warn=1
            echo "secret_list_failed" >> "$WARN_REASONS"
            : > "$OUT/secret-accessor-runtime-sa.txt"
            : > "$OUT/missing-required-secret-accessor.txt"
            : > "$OUT/extra-runtime-secret-accessor.txt"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${VERIFY_WORKFLOW_FILE}/runs?per_page=10" \
            > "$OUT/gh-verify-runs.json" || {
              fail=1
              echo '{"workflow_runs":[]}' > "$OUT/gh-verify-runs.json"
              echo "[FAIL] cannot read verify workflow runs" > "$OUT/gh-verify-runs.error.txt"
              echo "verify_workflow_runs_read_failed" >> "$FAIL_REASONS"
            }

          jq -r '.workflow_runs[] | [.id,.status,.conclusion,.created_at] | @tsv' \
            "$OUT/gh-verify-runs.json" > "$OUT/gh-verify-runs.txt" || true

          service_url="$(jq -r '.status.url // empty' "$OUT/run-service.json" || true)"
          if [ -z "$service_url" ]; then
            fail=1
            echo "[FAIL] service url missing" > "$OUT/smoke.error.txt"
            echo "service_url_missing" >> "$FAIL_REASONS"
          else
            code="$(curl -sS -o "$OUT/smoke-body.txt" -D "$OUT/smoke-headers.txt" -w "%{http_code}" "$service_url" || true)"
            echo "$code" > "$OUT/smoke-status.txt"
            if [ "$code" != "200" ]; then
              fail=1
              echo "smoke_http_${code}" >> "$FAIL_REASONS"
            fi
          fi

          runtime_sa="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$OUT/run-service.json" || true)"
          echo "$runtime_sa" > "$OUT/runtime-sa.txt"
          if [ "$runtime_sa" != "$EXPECTED_RUNTIME_SA" ]; then
            fail=1
            echo "runtime_sa_mismatch" >> "$FAIL_REASONS"
          fi
          if echo "$runtime_sa" | grep -q 'compute@developer.gserviceaccount.com'; then
            fail=1
            echo "runtime_sa_default_compute_detected" >> "$FAIL_REASONS"
          fi

          success_count="$(jq -r '[.workflow_runs[]? | select(.conclusion=="success")] | length' "$OUT/gh-verify-runs.json" 2>/dev/null || echo 0)"
          if ! [[ "$success_count" =~ ^[0-9]+$ ]]; then
            success_count=0
          fi
          if [ "$success_count" -lt 1 ]; then
            fail=1
            echo "verify_workflow_success_count_zero" >> "$FAIL_REASONS"
          fi

          for key in nonces partner_nonces owner_rate_limit; do
            if ! jq -e --arg k "$key" 'tostring | test($k)' "$OUT/firestore-ttls.json" >/dev/null 2>&1; then
              warn=1
              echo "ttl_missing_${key}" >> "$WARN_REASONS"
            fi
          done

          if [ -s "$OUT/project-iam-editor-owner.txt" ]; then
            warn=1
            echo "project_has_editor_or_owner_bindings" >> "$WARN_REASONS"
          fi
          if [ -s "$OUT/secret-accessor-project.txt" ]; then
            warn=1
            echo "project_has_secret_accessor_bindings" >> "$WARN_REASONS"
          fi
          if [ -s "$OUT/missing-required-secret-accessor.txt" ]; then
            warn=1
            echo "required_secret_accessor_missing" >> "$WARN_REASONS"
          fi
          if [ -s "$OUT/extra-runtime-secret-accessor.txt" ]; then
            warn=1
            echo "runtime_sa_has_extra_secret_accessor" >> "$WARN_REASONS"
          fi

          WARN_CATEGORIES="$OUT/warn-categories.txt"
          FAIL_CATEGORIES="$OUT/fail-categories.txt"
          : > "$WARN_CATEGORIES"
          : > "$FAIL_CATEGORIES"

          while IFS= read -r reason; do
            [ -z "$reason" ] && continue
            case "$reason" in
              ttl_*)
                echo "WARN_TTL" >> "$WARN_CATEGORIES"
                ;;
              project_has_editor_or_owner_bindings)
                echo "WARN_EDITOR_OWNER" >> "$WARN_CATEGORIES"
                ;;
              runtime_sa_has_extra_secret_accessor|project_has_secret_accessor_bindings)
                echo "WARN_OPTIONAL_SECRET_EXTRA" >> "$WARN_CATEGORIES"
                ;;
              required_secret_accessor_missing)
                echo "WARN_REQUIRED_SECRET_MISSING" >> "$WARN_CATEGORIES"
                ;;
              runtime_sa_drift)
                echo "WARN_RUNTIME_DRIFT" >> "$WARN_CATEGORIES"
                ;;
              *)
                echo "WARN_UNKNOWN" >> "$WARN_CATEGORIES"
                ;;
            esac
          done < "$WARN_REASONS"

          while IFS= read -r reason; do
            [ -z "$reason" ] && continue
            case "$reason" in
              run_service_describe_failed|functions_list_failed|project_iam_read_failed|verify_workflow_runs_read_failed|service_url_missing|smoke_http_*|runtime_sa_mismatch|runtime_sa_default_compute_detected|verify_workflow_success_count_zero)
                echo "ERROR_RUNTIME_OR_OBSERVE" >> "$FAIL_CATEGORIES"
                ;;
              *)
                echo "ERROR_UNKNOWN" >> "$FAIL_CATEGORIES"
                ;;
            esac
          done < "$FAIL_REASONS"

          sort -u "$WARN_CATEGORIES" -o "$WARN_CATEGORIES"
          sort -u "$FAIL_CATEGORIES" -o "$FAIL_CATEGORIES"

          WARN_TTL_COUNT="$(grep -c '^WARN_TTL$' "$WARN_CATEGORIES" || true)"
          WARN_EDITOR_OWNER_COUNT="$(grep -c '^WARN_EDITOR_OWNER$' "$WARN_CATEGORIES" || true)"
          WARN_OPTIONAL_SECRET_EXTRA_COUNT="$(grep -c '^WARN_OPTIONAL_SECRET_EXTRA$' "$WARN_CATEGORIES" || true)"
          WARN_REQUIRED_SECRET_MISSING_COUNT="$(grep -c '^WARN_REQUIRED_SECRET_MISSING$' "$WARN_CATEGORIES" || true)"
          WARN_RUNTIME_DRIFT_COUNT="$(grep -c '^WARN_RUNTIME_DRIFT$' "$WARN_CATEGORIES" || true)"
          WARN_UNKNOWN_COUNT="$(grep -c '^WARN_UNKNOWN$' "$WARN_CATEGORIES" || true)"
          WARN_TOTAL="$((WARN_TTL_COUNT + WARN_EDITOR_OWNER_COUNT + WARN_OPTIONAL_SECRET_EXTRA_COUNT + WARN_REQUIRED_SECRET_MISSING_COUNT + WARN_RUNTIME_DRIFT_COUNT + WARN_UNKNOWN_COUNT))"
          ERROR_SECRET_REQUIRED_MISSING_COUNT="$(grep -c '^ERROR_SECRET_REQUIRED_MISSING$' "$FAIL_CATEGORIES" || true)"
          ERROR_RUNTIME_OR_OBSERVE_COUNT="$(grep -c '^ERROR_RUNTIME_OR_OBSERVE$' "$FAIL_CATEGORIES" || true)"
          ERROR_UNKNOWN_COUNT="$(grep -c '^ERROR_UNKNOWN$' "$FAIL_CATEGORIES" || true)"
          ERROR_TOTAL="$((ERROR_SECRET_REQUIRED_MISSING_COUNT + ERROR_RUNTIME_OR_OBSERVE_COUNT + ERROR_UNKNOWN_COUNT))"

          status="OK"
          if [ "$fail" -eq 1 ]; then
            status="FAIL"
          elif [ "$warn" -eq 1 ]; then
            status="WARN"
          fi

          jq -n \
            --arg status "$status" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --argjson warn_total "$WARN_TOTAL" \
            --argjson error_total "$ERROR_TOTAL" \
            --argjson warn_ttl "$WARN_TTL_COUNT" \
            --argjson warn_editor_owner "$WARN_EDITOR_OWNER_COUNT" \
            --argjson warn_optional_secret_extra "$WARN_OPTIONAL_SECRET_EXTRA_COUNT" \
            --argjson warn_required_secret_missing "$WARN_REQUIRED_SECRET_MISSING_COUNT" \
            --argjson warn_runtime_drift "$WARN_RUNTIME_DRIFT_COUNT" \
            --argjson warn_unknown "$WARN_UNKNOWN_COUNT" \
            --argjson error_secret_required_missing "$ERROR_SECRET_REQUIRED_MISSING_COUNT" \
            --argjson error_runtime_or_observe "$ERROR_RUNTIME_OR_OBSERVE_COUNT" \
            --argjson error_unknown "$ERROR_UNKNOWN_COUNT" \
            '
            {
              schema_version: "1.0.0",
              status: $status,
              run_id: $run_id,
              next_task_id: "KEEP-MANUAL",
              counts: {
                warn: $warn_total,
                fail: $error_total
              },
              warn_by_category: {
                WARN_TTL: $warn_ttl,
                WARN_EDITOR_OWNER: $warn_editor_owner,
                WARN_OPTIONAL_SECRET_EXTRA: $warn_optional_secret_extra,
                WARN_REQUIRED_SECRET_MISSING: $warn_required_secret_missing,
                WARN_RUNTIME_DRIFT: $warn_runtime_drift,
                WARN_UNKNOWN: $warn_unknown
              },
              fail_by_category: {
                ERROR_SECRET_REQUIRED_MISSING: $error_secret_required_missing,
                ERROR_RUNTIME_OR_OBSERVE: $error_runtime_or_observe,
                ERROR_UNKNOWN: $error_unknown
              }
            }
            ' > "$OUT/metrics.json"

          jq '
            .actions = (
              [
                {category:"WARN_TTL", count:(.warn_by_category.WARN_TTL // 0), action_class:"monitor", priority:"P2", owner:"ops", target:"firestore_ttl", due_hint:"before_next_rotation"},
                {category:"WARN_EDITOR_OWNER", count:(.warn_by_category.WARN_EDITOR_OWNER // 0), action_class:"ignore", priority:"P3", owner:"none", target:"project_iam", due_hint:null},
                {category:"WARN_OPTIONAL_SECRET_EXTRA", count:(.warn_by_category.WARN_OPTIONAL_SECRET_EXTRA // 0), action_class:"monitor", priority:"P2", owner:"ops", target:"secret_iam", due_hint:"next_iam_cycle"},
                {category:"WARN_REQUIRED_SECRET_MISSING", count:(.warn_by_category.WARN_REQUIRED_SECRET_MISSING // 0), action_class:"owner_action", priority:"P1", owner:"platform", target:"secret_iam", due_hint:"same_day"},
                {category:"WARN_RUNTIME_DRIFT", count:(.warn_by_category.WARN_RUNTIME_DRIFT // 0), action_class:"owner_action", priority:"P1", owner:"platform", target:"runtime", due_hint:"immediate"},
                {category:"WARN_UNKNOWN", count:(.warn_by_category.WARN_UNKNOWN // 0), action_class:"owner_action", priority:"P1", owner:"platform", target:"unknown", due_hint:"same_day"},
                {category:"ERROR_RUNTIME_OR_OBSERVE", count:(.fail_by_category.ERROR_RUNTIME_OR_OBSERVE // 0), action_class:"block", priority:"P0", owner:"platform", target:"runtime", due_hint:"immediate"},
                {category:"ERROR_SECRET_REQUIRED_MISSING", count:(.fail_by_category.ERROR_SECRET_REQUIRED_MISSING // 0), action_class:"block", priority:"P0", owner:"platform", target:"secret_iam", due_hint:"immediate"},
                {category:"ERROR_UNKNOWN", count:(.fail_by_category.ERROR_UNKNOWN // 0), action_class:"block", priority:"P0", owner:"platform", target:"unknown", due_hint:"immediate"}
              ] | map(select(.count > 0))
            )
          ' "$OUT/metrics.json" > "$OUT/metrics.tmp.json"
          mv "$OUT/metrics.tmp.json" "$OUT/metrics.json"

          PREV_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ops-autopilot-observe.yml/runs?per_page=15" \
            | jq -r --arg cur "${GITHUB_RUN_ID}" '.workflow_runs[] | select((.id|tostring) != $cur and .status == "completed") | .id' \
            | head -n1)"
          echo "${PREV_RUN_ID:-}" > "$OUT/previous-run-id.txt"
          if [ -n "${PREV_RUN_ID:-}" ]; then
            if gh run download "$PREV_RUN_ID" --name "ops-autopilot-observe-${PREV_RUN_ID}" -D "$OUT/previous" >/dev/null 2>&1; then
              prev_metrics="$(find "$OUT/previous" -name metrics.json -type f | head -n1 || true)"
              if [ -n "${prev_metrics:-}" ] && [ -f "$prev_metrics" ]; then
                jq -n \
                  --slurpfile prev "$prev_metrics" \
                  --slurpfile curr "$OUT/metrics.json" \
                  '
                  def nz($obj): ($obj | to_entries | map(select(.value > 0) | .key));
                  {
                    current_status: ($curr[0].status // "UNKNOWN"),
                    previous_status: ($prev[0].status // "UNKNOWN"),
                    status_delta: (($prev[0].status // "UNKNOWN") + " -> " + ($curr[0].status // "UNKNOWN")),
                    new_warn_categories: ((nz($curr[0].warn_by_category) - nz($prev[0].warn_by_category))),
                    resolved_warn_categories: ((nz($prev[0].warn_by_category) - nz($curr[0].warn_by_category))),
                    new_fail_categories: ((nz($curr[0].fail_by_category) - nz($prev[0].fail_by_category))),
                    resolved_fail_categories: ((nz($prev[0].fail_by_category) - nz($curr[0].fail_by_category)))
                  }
                  ' > "$OUT/metrics-diff.json"
              else
                jq -n '{diff_skipped:true, reason:"previous_metrics_not_found"}' > "$OUT/metrics-diff.json"
              fi
            else
              jq -n '{diff_skipped:true, reason:"previous_artifact_download_failed"}' > "$OUT/metrics-diff.json"
            fi
          else
            jq -n '{diff_skipped:true, reason:"previous_run_not_found"}' > "$OUT/metrics-diff.json"
          fi

          cat > "$OUT/warn-allowlist.txt" <<'EOF'
          WARN_TTL
          WARN_EDITOR_OWNER
          WARN_OPTIONAL_SECRET_EXTRA
          WARN_REQUIRED_SECRET_MISSING
          WARN_RUNTIME_DRIFT
          EOF
          sort -u "$OUT/warn-allowlist.txt" -o "$OUT/warn-allowlist.txt"
          grep -Fxv -f "$OUT/warn-allowlist.txt" "$WARN_CATEGORIES" > "$OUT/non-allowlisted-warns.txt" || true
          if [ -s "$OUT/non-allowlisted-warns.txt" ]; then
            warn=1
            echo "policy_warn_not_allowlisted" >> "$WARN_REASONS"
          fi

          cat > "$OUT/due-enforced-categories.txt" <<'EOF'
          WARN_RUNTIME_DRIFT
          WARN_UNKNOWN
          EOF
          sort -u "$OUT/due-enforced-categories.txt" -o "$OUT/due-enforced-categories.txt"

          PREV3_RUN_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ops-autopilot-observe.yml/runs?per_page=30" \
            | jq -r --arg cur "${GITHUB_RUN_ID}" '.workflow_runs[] | select((.id|tostring) != $cur and .status == "completed") | .id' \
            | head -n3)"

          : > "$OUT/warn-recurrence.tsv"
          POLICY_BLOCK_COUNT=0
          while IFS= read -r category; do
            [ -z "$category" ] && continue
            rec_count=1
            for rid in $PREV3_RUN_IDS; do
              rdir="$OUT/recurrence/$rid"
              if [ ! -d "$rdir" ]; then
                mkdir -p "$rdir"
                gh run download "$rid" --name "ops-autopilot-observe-${rid}" -D "$rdir" >/dev/null 2>&1 || true
              fi
              prev_metrics="$(find "$rdir" -name metrics.json -type f | head -n1 || true)"
              if [ -n "$prev_metrics" ] && [ -f "$prev_metrics" ] && jq -e --arg c "$category" '((.warn_by_category[$c] // 0) > 0)' "$prev_metrics" >/dev/null 2>&1; then
                rec_count=$((rec_count + 1))
              else
                break
              fi
            done
            echo -e "${category}\t${rec_count}" >> "$OUT/warn-recurrence.tsv"

            due_hint="$(jq -r --arg c "$category" '.actions[]? | select(.category==$c) | .due_hint // ""' "$OUT/metrics.json" | head -n1)"
            threshold=99
            case "$due_hint" in
              immediate|same_day) threshold=2 ;;
              before_next_rotation) threshold=3 ;;
              next_iam_cycle) threshold=4 ;;
            esac
            if grep -qx "$category" "$OUT/due-enforced-categories.txt" && [ "$threshold" -lt 99 ] && [ "$rec_count" -ge "$threshold" ]; then
              fail=1
              POLICY_BLOCK_COUNT=$((POLICY_BLOCK_COUNT + 1))
              echo "warn_due_exceeded_${category}" >> "$FAIL_REASONS"
            fi
          done < "$WARN_CATEGORIES"

          jq -Rn '
            [inputs | split("\t") | {key: .[0], value: (.[1]|tonumber)}] | from_entries
          ' < "$OUT/warn-recurrence.tsv" > "$OUT/warn-recurrence.json"

          jq --slurpfile rec "$OUT/warn-recurrence.json" '
            def escalate($p):
              if $p == "P3" then "P2"
              elif $p == "P2" then "P1"
              elif $p == "P1" then "P0"
              else $p end;
            def due_threshold($h):
              if $h == "immediate" or $h == "same_day" then 2
              elif $h == "before_next_rotation" then 3
              elif $h == "next_iam_cycle" then 4
              else 99 end;
            .actions = (.actions // [] | map(
              . + { recurrence_count: ($rec[0][.category] // 0) }
              | . + {
                  effective_priority:
                    (if (.recurrence_count // 0) >= 3 and (.priority | startswith("P")) then escalate(.priority) else .priority end)
                }
              | . + {
                  due_threshold: due_threshold(.due_hint // ""),
                  due_over:
                    (if due_threshold(.due_hint // "") < 99 and (.recurrence_count // 0) >= due_threshold(.due_hint // "") then true else false end)
                }
            ))
          ' "$OUT/metrics.json" > "$OUT/metrics.tmp.json"
          mv "$OUT/metrics.tmp.json" "$OUT/metrics.json"

          if [ "$POLICY_BLOCK_COUNT" -gt 0 ] || [ -s "$OUT/non-allowlisted-warns.txt" ]; then
            echo "ERROR_POLICY_GUARDRAIL" >> "$FAIL_CATEGORIES"
          fi
          sort -u "$FAIL_CATEGORIES" -o "$FAIL_CATEGORIES"

          WARN_TOTAL="$(wc -l < "$WARN_CATEGORIES" | tr -d ' ')"
          ERROR_TOTAL="$(wc -l < "$FAIL_CATEGORIES" | tr -d ' ')"
          ERROR_POLICY_GUARDRAIL_COUNT="$(grep -c '^ERROR_POLICY_GUARDRAIL$' "$FAIL_CATEGORIES" || true)"

          status="OK"
          if [ "$fail" -eq 1 ]; then
            status="FAIL"
          elif [ "$warn" -eq 1 ]; then
            status="WARN"
          fi

          next_task_id="KEEP-MANUAL"
          case "$status" in
            OK) next_task_id="S-24-07" ;;
            WARN) next_task_id="S-24-07" ;;
            FAIL) next_task_id="BLOCK-TRIAGE" ;;
          esac

          jq --arg status "$status" \
             --arg next_task_id "$next_task_id" \
             --argjson warn_total "$WARN_TOTAL" \
             --argjson error_total "$ERROR_TOTAL" \
             --argjson error_policy_guardrail "$ERROR_POLICY_GUARDRAIL_COUNT" '
            .status = $status
            | .next_task_id = $next_task_id
            | .counts.warn = $warn_total
            | .counts.fail = $error_total
            | .fail_by_category.ERROR_POLICY_GUARDRAIL = $error_policy_guardrail
          ' "$OUT/metrics.json" > "$OUT/metrics.tmp.json"
          mv "$OUT/metrics.tmp.json" "$OUT/metrics.json"

          DRAFT_ISSUES_DIR="$OUT/drafts/issues"
          DRAFT_PRS_DIR="$OUT/drafts/prs"
          mkdir -p "$DRAFT_ISSUES_DIR" "$DRAFT_PRS_DIR"
          CURRENT_DRAFT_INDEX="$OUT/drafts/draft-index.tsv"
          AUTO_ISSUE_CANDIDATES="$OUT/drafts/issue-auto-candidates.tsv"
          : > "$CURRENT_DRAFT_INDEX"
          : > "$AUTO_ISSUE_CANDIDATES"
          PREV_DRAFT_INDEX="$(find "$OUT/previous" -path '*/drafts/draft-index.tsv' -type f | head -n1 || true)"
          ISSUE_DRAFT_NEW=0
          ISSUE_DRAFT_SKIPPED_DEDUPE=0
          PR_DRAFT_NEW=0
          PR_DRAFT_SKIPPED_DEDUPE=0
          ISSUE_AUTO_CANDIDATES=0
          ISSUE_CREATED=0
          ISSUE_SKIPPED_EXISTING=0
          ISSUE_CREATE_FAILED=0
          BLOCK_HUMAN_COUNT=0

          decode_field() {
            printf '%s' "$1" | base64 --decode | jq -r "$2"
          }

          priority_rank() {
            case "$1" in
              P0) echo 0 ;;
              P1) echo 1 ;;
              P2) echo 2 ;;
              P3) echo 3 ;;
              *) echo 9 ;;
            esac
          }

          status_transition_fail=0
          if jq -e '.status_delta == "WARN -> FAIL"' "$OUT/metrics-diff.json" >/dev/null 2>&1; then
            status_transition_fail=1
          fi

          jq -r '.actions[]? | @base64' "$OUT/metrics.json" | while IFS= read -r row; do
            [ -z "$row" ] && continue
            category="$(decode_field "$row" '.category // "UNKNOWN"')"
            action_class="$(decode_field "$row" '.action_class // "monitor"')"
            priority="$(decode_field "$row" '.priority // "P3"')"
            effective_priority="$(decode_field "$row" '.effective_priority // .priority // "P3"')"
            owner="$(decode_field "$row" '.owner // "none"')"
            target="$(decode_field "$row" '.target // .category // "global"')"
            due_hint="$(decode_field "$row" '.due_hint // "none"')"
            due_over="$(decode_field "$row" '.due_over // false')"
            count="$(decode_field "$row" '.count // 0')"
            recurrence="$(decode_field "$row" '.recurrence_count // 0')"
            dedupe_key="${category}|${owner}|${action_class}|${target}"
            key_slug="$(printf '%s' "$dedupe_key" | tr -c 'a-zA-Z0-9_-' '_')"

            draft_slug="$(printf '%s' "${category}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_' '_')"
            promotion_class="draft_only"
            if [ "$action_class" = "block" ]; then
              promotion_class="block_human"
            elif [ "$due_over" = "true" ]; then
              promotion_class="auto_issue"
            elif { [ "$effective_priority" = "P0" ] || [ "$effective_priority" = "P1" ]; } && [ "$recurrence" -ge 2 ]; then
              promotion_class="auto_issue"
            fi

            issue_needed=0
            if [ "$promotion_class" = "block_human" ] || [ "$promotion_class" = "auto_issue" ]; then
              issue_needed=1
            fi

            if [ "$issue_needed" -eq 1 ]; then
              prev_rec=0
              prev_priority="P3"
              prev_due_over="false"
              prev_status="UNKNOWN"
              if [ -n "${PREV_DRAFT_INDEX:-}" ] && [ -f "$PREV_DRAFT_INDEX" ]; then
                prev_rec="$(awk -F'\t' -v kind="issue" -v k="$dedupe_key" '$1==kind && $2==k{print $3; exit}' "$PREV_DRAFT_INDEX" 2>/dev/null || echo 0)"
                prev_priority="$(awk -F'\t' -v kind="issue" -v k="$dedupe_key" '$1==kind && $2==k{print $4; exit}' "$PREV_DRAFT_INDEX" 2>/dev/null || echo P3)"
                prev_due_over="$(awk -F'\t' -v kind="issue" -v k="$dedupe_key" '$1==kind && $2==k{print $5; exit}' "$PREV_DRAFT_INDEX" 2>/dev/null || echo false)"
                prev_status="$(awk -F'\t' -v kind="issue" -v k="$dedupe_key" '$1==kind && $2==k{print $6; exit}' "$PREV_DRAFT_INDEX" 2>/dev/null || echo UNKNOWN)"
              fi
              if ! [[ "$prev_rec" =~ ^[0-9]+$ ]]; then
                prev_rec=0
              fi
              curr_rank="$(priority_rank "$effective_priority")"
              prev_rank="$(priority_rank "$prev_priority")"
              priority_up=0
              if [ "$curr_rank" -lt "$prev_rank" ]; then
                priority_up=1
              fi
              due_escalated=0
              if [ "$due_over" = "true" ] && [ "$prev_due_over" != "true" ]; then
                due_escalated=1
              fi
              status_warn_to_fail=0
              if [ "$status_transition_fail" -eq 1 ] && { [ "$prev_status" = "WARN" ] || [ "$prev_status" = "UNKNOWN" ]; }; then
                status_warn_to_fail=1
              fi
              if [ "$recurrence" -gt "$prev_rec" ] || [ "$priority_up" -eq 1 ] || [ "$due_escalated" -eq 1 ] || [ "$status_warn_to_fail" -eq 1 ]; then
                {
                  echo "# [AUTO-DRAFT] $category"
                  echo
                  echo "- Draft-Key: $dedupe_key"
                  echo "- Recurrence-Count: $recurrence"
                  echo "- Effective-Priority: $effective_priority"
                  echo
                  echo "## Why"
                  echo "- action_class: $action_class"
                  echo "- priority: $priority"
                  echo "- effective_priority: $effective_priority"
                  echo "- count: $count"
                  echo "- recurrence_count: $recurrence"
                  echo "- target: $target"
                  echo "- due_over: $due_over"
                  echo "- promotion_class: $promotion_class"
                  echo "- owner: $owner"
                  echo "- due_hint: $due_hint"
                  echo "- run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  echo
                  echo "## Suggested Next Step"
                  echo "1. Confirm scope using \`artifacts/ops-autopilot/\`"
                  echo "2. Apply smallest remediation for \`$category\`"
                  echo "3. Re-run \`ops-autopilot-observe\` and verify category resolved"
                  echo
                  echo "## Rollback"
                  echo "- No automatic production change performed."
                } > "$DRAFT_ISSUES_DIR/issue_${draft_slug}.md"
                ISSUE_DRAFT_NEW=$((ISSUE_DRAFT_NEW + 1))
                if [ "$promotion_class" = "auto_issue" ]; then
                  ISSUE_AUTO_CANDIDATES=$((ISSUE_AUTO_CANDIDATES + 1))
                  printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                    "$dedupe_key" "$key_slug" "$category" "$effective_priority" "$recurrence" "$DRAFT_ISSUES_DIR/issue_${draft_slug}.md" \
                    >> "$AUTO_ISSUE_CANDIDATES"
                elif [ "$promotion_class" = "block_human" ]; then
                  BLOCK_HUMAN_COUNT=$((BLOCK_HUMAN_COUNT + 1))
                fi
              else
                ISSUE_DRAFT_SKIPPED_DEDUPE=$((ISSUE_DRAFT_SKIPPED_DEDUPE + 1))
              fi
              echo -e "issue\t${dedupe_key}\t${recurrence}\t${effective_priority}\t${due_over}\t${status}" >> "$CURRENT_DRAFT_INDEX"
            fi

            pr_needed=0
            if [ "$action_class" = "owner_action" ]; then
              case "$category" in
                WARN_RUNTIME_DRIFT|WARN_REQUIRED_SECRET_MISSING|WARN_TTL)
                  pr_needed=1
                  ;;
              esac
            fi
            if [ "$pr_needed" -eq 1 ]; then
              prev_rec=0
              prev_priority="P3"
              prev_due_over="false"
              prev_status="UNKNOWN"
              if [ -n "${PREV_DRAFT_INDEX:-}" ] && [ -f "$PREV_DRAFT_INDEX" ]; then
                prev_rec="$(awk -F'\t' -v kind="pr" -v k="$dedupe_key" '$1==kind && $2==k{print $3; exit}' "$PREV_DRAFT_INDEX" 2>/dev/null || echo 0)"
                prev_priority="$(awk -F'\t' -v kind="pr" -v k="$dedupe_key" '$1==kind && $2==k{print $4; exit}' "$PREV_DRAFT_INDEX" 2>/dev/null || echo P3)"
                prev_due_over="$(awk -F'\t' -v kind="pr" -v k="$dedupe_key" '$1==kind && $2==k{print $5; exit}' "$PREV_DRAFT_INDEX" 2>/dev/null || echo false)"
                prev_status="$(awk -F'\t' -v kind="pr" -v k="$dedupe_key" '$1==kind && $2==k{print $6; exit}' "$PREV_DRAFT_INDEX" 2>/dev/null || echo UNKNOWN)"
              fi
              if ! [[ "$prev_rec" =~ ^[0-9]+$ ]]; then
                prev_rec=0
              fi
              curr_rank="$(priority_rank "$effective_priority")"
              prev_rank="$(priority_rank "$prev_priority")"
              priority_up=0
              if [ "$curr_rank" -lt "$prev_rank" ]; then
                priority_up=1
              fi
              due_escalated=0
              if [ "$due_over" = "true" ] && [ "$prev_due_over" != "true" ]; then
                due_escalated=1
              fi
              status_warn_to_fail=0
              if [ "$status_transition_fail" -eq 1 ] && { [ "$prev_status" = "WARN" ] || [ "$prev_status" = "UNKNOWN" ]; }; then
                status_warn_to_fail=1
              fi
              if [ "$recurrence" -gt "$prev_rec" ] || [ "$priority_up" -eq 1 ] || [ "$due_escalated" -eq 1 ] || [ "$status_warn_to_fail" -eq 1 ]; then
                {
                  echo "# [AUTO-DRAFT PR] $category"
                  echo
                  echo "- Draft-Key: $dedupe_key"
                  echo "- Recurrence-Count: $recurrence"
                  echo "- Effective-Priority: $effective_priority"
                  echo
                  echo "## Intent"
                  echo "- Prepare minimal diff proposal for \`$category\`"
                  echo "- No code was changed automatically"
                  echo
                  echo "## Candidate Files"
                  echo "- \`.github/workflows/ops-autopilot-observe.yml\`"
                  echo "- \`ops/runbook.md\`"
                  echo "- \`docs/iam-reduction-policy.md\`"
                  echo
                  echo "## Acceptance"
                  echo "1. Category count decreases on next run"
                  echo "2. No new FAIL categories introduced"
                  echo "3. Evidence artifact retained"
                } > "$DRAFT_PRS_DIR/pr_${draft_slug}.md"
                PR_DRAFT_NEW=$((PR_DRAFT_NEW + 1))
              else
                PR_DRAFT_SKIPPED_DEDUPE=$((PR_DRAFT_SKIPPED_DEDUPE + 1))
              fi
              echo -e "pr\t${dedupe_key}\t${recurrence}\t${effective_priority}\t${due_over}\t${status}" >> "$CURRENT_DRAFT_INDEX"
            fi
          done < <(jq -r '.actions[]? | @base64' "$OUT/metrics.json")

          ISSUE_DRAFT_COUNT="$(find "$DRAFT_ISSUES_DIR" -type f -name '*.md' | wc -l | tr -d ' ')"
          PR_DRAFT_COUNT="$(find "$DRAFT_PRS_DIR" -type f -name '*.md' | wc -l | tr -d ' ')"

          while IFS=$'\t' read -r candidate_key candidate_slug candidate_category candidate_priority candidate_recurrence candidate_draft; do
            [ -z "${candidate_slug:-}" ] && continue
            issue_title="[AUTO][${candidate_slug}] ${candidate_category} (${candidate_priority})"
            existing_issue_id="$(gh issue list --state open --limit 100 --search "\"[AUTO][${candidate_slug}]\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
            if [ -n "${existing_issue_id:-}" ] && [ "${existing_issue_id}" != "null" ]; then
              ISSUE_SKIPPED_EXISTING=$((ISSUE_SKIPPED_EXISTING + 1))
              continue
            fi
            if gh issue create --title "$issue_title" --body-file "$candidate_draft" >/dev/null 2>&1; then
              ISSUE_CREATED=$((ISSUE_CREATED + 1))
            else
              ISSUE_CREATE_FAILED=$((ISSUE_CREATE_FAILED + 1))
            fi
          done < "$AUTO_ISSUE_CANDIDATES"

          jq --argjson issue_drafts "$ISSUE_DRAFT_COUNT" \
             --argjson pr_drafts "$PR_DRAFT_COUNT" \
             --argjson issue_drafts_new "$ISSUE_DRAFT_NEW" \
             --argjson issue_drafts_skipped_dedupe "$ISSUE_DRAFT_SKIPPED_DEDUPE" \
             --argjson pr_drafts_new "$PR_DRAFT_NEW" \
             --argjson pr_drafts_skipped_dedupe "$PR_DRAFT_SKIPPED_DEDUPE" \
             --argjson issue_auto_candidates "$ISSUE_AUTO_CANDIDATES" \
             --argjson issue_created "$ISSUE_CREATED" \
             --argjson issue_skipped_existing "$ISSUE_SKIPPED_EXISTING" \
             --argjson issue_create_failed "$ISSUE_CREATE_FAILED" \
             --argjson block_human "$BLOCK_HUMAN_COUNT" '
            .drafts = {
              issue: $issue_drafts,
              pr: $pr_drafts,
              issue_drafts_new: $issue_drafts_new,
              issue_drafts_skipped_dedupe: $issue_drafts_skipped_dedupe,
              pr_drafts_new: $pr_drafts_new,
              pr_drafts_skipped_dedupe: $pr_drafts_skipped_dedupe
            }
            | .promotions = {
              issue_auto_candidates: $issue_auto_candidates,
              issue_created: $issue_created,
              issue_skipped_existing: $issue_skipped_existing,
              issue_create_failed: $issue_create_failed,
              block_human: $block_human
            }
          ' "$OUT/metrics.json" > "$OUT/metrics.tmp.json"
          mv "$OUT/metrics.tmp.json" "$OUT/metrics.json"

          if [ "$ISSUE_CREATE_FAILED" -gt 0 ]; then
            fail=1
            echo "auto_issue_create_failed" >> "$FAIL_REASONS"
            echo "ERROR_AUTOMATION" >> "$FAIL_CATEGORIES"
            sort -u "$FAIL_CATEGORIES" -o "$FAIL_CATEGORIES"
          fi

          {
            echo "# Draft Candidates"
            echo
            echo "- issue_drafts: $ISSUE_DRAFT_COUNT"
            echo "- pr_drafts: $PR_DRAFT_COUNT"
            echo "- issue_drafts_new: $ISSUE_DRAFT_NEW"
            echo "- issue_drafts_skipped_dedupe: $ISSUE_DRAFT_SKIPPED_DEDUPE"
            echo "- pr_drafts_new: $PR_DRAFT_NEW"
            echo "- pr_drafts_skipped_dedupe: $PR_DRAFT_SKIPPED_DEDUPE"
            echo "- issue_auto_candidates: $ISSUE_AUTO_CANDIDATES"
            echo "- issue_created: $ISSUE_CREATED"
            echo "- issue_skipped_existing: $ISSUE_SKIPPED_EXISTING"
            echo "- issue_create_failed: $ISSUE_CREATE_FAILED"
            echo "- block_human: $BLOCK_HUMAN_COUNT"
            echo
            echo "## Issue Drafts"
            find "$DRAFT_ISSUES_DIR" -maxdepth 1 -type f -name '*.md' -print | sed 's#^#- #' || true
            echo
            echo "## PR Drafts"
            find "$DRAFT_PRS_DIR" -maxdepth 1 -type f -name '*.md' -print | sed 's#^#- #' || true
          } > "$OUT/drafts/summary-actions.md"

          WARN_TOTAL="$(wc -l < "$WARN_CATEGORIES" | tr -d ' ')"
          ERROR_TOTAL="$(wc -l < "$FAIL_CATEGORIES" | tr -d ' ')"
          ERROR_POLICY_GUARDRAIL_COUNT="$(grep -c '^ERROR_POLICY_GUARDRAIL$' "$FAIL_CATEGORIES" || true)"
          ERROR_AUTOMATION_COUNT="$(grep -c '^ERROR_AUTOMATION$' "$FAIL_CATEGORIES" || true)"

          status="OK"
          if [ "$fail" -eq 1 ]; then
            status="FAIL"
          elif [ "$warn" -eq 1 ]; then
            status="WARN"
          fi

          next_task_id="KEEP-MANUAL"
          case "$status" in
            OK) next_task_id="S-24-07" ;;
            WARN) next_task_id="S-24-07" ;;
            FAIL) next_task_id="BLOCK-TRIAGE" ;;
          esac

          jq --arg status "$status" \
             --arg next_task_id "$next_task_id" \
             --argjson warn_total "$WARN_TOTAL" \
             --argjson error_total "$ERROR_TOTAL" \
             --argjson error_policy_guardrail "$ERROR_POLICY_GUARDRAIL_COUNT" \
             --argjson error_automation "$ERROR_AUTOMATION_COUNT" '
            .status = $status
            | .next_task_id = $next_task_id
            | .counts.warn = $warn_total
            | .counts.fail = $error_total
            | .fail_by_category.ERROR_POLICY_GUARDRAIL = $error_policy_guardrail
            | .fail_by_category.ERROR_AUTOMATION = $error_automation
          ' "$OUT/metrics.json" > "$OUT/metrics.tmp.json"
          mv "$OUT/metrics.tmp.json" "$OUT/metrics.json"

          echo "$status" > "$OUT/status.txt"

          {
            echo "# Ops Autopilot Observe"
            echo
            echo "- Status: $status"
            echo "- Project: $PROJECT_ID"
            echo "- Region: $REGION"
            echo "- Service: $SERVICE"
            echo "- Runtime SA: $runtime_sa"
            echo "- Verify success count (last 10): $success_count"
            if [ -s "$OUT/secret-accessor-runtime-sa.txt" ]; then
              echo "- Runtime SA secret bindings:"
              sed 's/^/  - /' "$OUT/secret-accessor-runtime-sa.txt"
            else
              echo "- Runtime SA secret bindings: (none)"
            fi
            if [ -s "$OUT/missing-required-secret-accessor.txt" ]; then
              echo "- Missing required runtime secret bindings:"
              sed 's/^/  - /' "$OUT/missing-required-secret-accessor.txt"
            fi
            if [ -s "$OUT/extra-runtime-secret-accessor.txt" ]; then
              echo "- Extra runtime secret bindings:"
              sed 's/^/  - /' "$OUT/extra-runtime-secret-accessor.txt"
            fi
            echo
            echo "## Fail Reasons"
            if [ -s "$FAIL_REASONS" ]; then
              sed 's/^/- /' "$FAIL_REASONS"
            else
              echo "- (none)"
            fi
            echo
            echo "## Warn Reasons"
            if [ -s "$WARN_REASONS" ]; then
              sed 's/^/- /' "$WARN_REASONS"
            else
              echo "- (none)"
            fi
            echo
            echo "## Counters"
            jq -r '
              "- WARN total: \(.counts.warn // 0)\n" +
              "- ERROR total: \(.counts.fail // 0)\n" +
              "- WARN_TTL: \(.warn_by_category.WARN_TTL // 0)\n" +
              "- WARN_EDITOR_OWNER: \(.warn_by_category.WARN_EDITOR_OWNER // 0)\n" +
              "- WARN_OPTIONAL_SECRET_EXTRA: \(.warn_by_category.WARN_OPTIONAL_SECRET_EXTRA // 0)\n" +
              "- WARN_REQUIRED_SECRET_MISSING: \(.warn_by_category.WARN_REQUIRED_SECRET_MISSING // 0)\n" +
              "- WARN_RUNTIME_DRIFT: \(.warn_by_category.WARN_RUNTIME_DRIFT // 0)\n" +
              "- WARN_UNKNOWN: \(.warn_by_category.WARN_UNKNOWN // 0)\n" +
              "- ERROR_RUNTIME_OR_OBSERVE: \(.fail_by_category.ERROR_RUNTIME_OR_OBSERVE // 0)\n" +
              "- ERROR_SECRET_REQUIRED_MISSING: \(.fail_by_category.ERROR_SECRET_REQUIRED_MISSING // 0)\n" +
              "- ERROR_POLICY_GUARDRAIL: \(.fail_by_category.ERROR_POLICY_GUARDRAIL // 0)\n" +
              "- ERROR_AUTOMATION: \(.fail_by_category.ERROR_AUTOMATION // 0)\n" +
              "- ERROR_UNKNOWN: \(.fail_by_category.ERROR_UNKNOWN // 0)"
            ' "$OUT/metrics.json"
            echo
            echo "## Machine Metrics"
            jq -r '
              "METRIC WARN_TOTAL=\(.counts.warn // 0)\n" +
              "METRIC ERROR_TOTAL=\(.counts.fail // 0)\n" +
              "METRIC WARN_TTL=\(.warn_by_category.WARN_TTL // 0)\n" +
              "METRIC WARN_EDITOR_OWNER=\(.warn_by_category.WARN_EDITOR_OWNER // 0)\n" +
              "METRIC WARN_OPTIONAL_SECRET_EXTRA=\(.warn_by_category.WARN_OPTIONAL_SECRET_EXTRA // 0)\n" +
              "METRIC WARN_REQUIRED_SECRET_MISSING=\(.warn_by_category.WARN_REQUIRED_SECRET_MISSING // 0)\n" +
              "METRIC WARN_RUNTIME_DRIFT=\(.warn_by_category.WARN_RUNTIME_DRIFT // 0)\n" +
              "METRIC WARN_UNKNOWN=\(.warn_by_category.WARN_UNKNOWN // 0)\n" +
              "METRIC ERROR_RUNTIME_OR_OBSERVE=\(.fail_by_category.ERROR_RUNTIME_OR_OBSERVE // 0)\n" +
              "METRIC ERROR_SECRET_REQUIRED_MISSING=\(.fail_by_category.ERROR_SECRET_REQUIRED_MISSING // 0)\n" +
              "METRIC ERROR_POLICY_GUARDRAIL=\(.fail_by_category.ERROR_POLICY_GUARDRAIL // 0)\n" +
              "METRIC ERROR_AUTOMATION=\(.fail_by_category.ERROR_AUTOMATION // 0)\n" +
              "METRIC ERROR_UNKNOWN=\(.fail_by_category.ERROR_UNKNOWN // 0)\n" +
              "METRIC ISSUE_DRAFTS=\(.drafts.issue // 0)\n" +
              "METRIC PR_DRAFTS=\(.drafts.pr // 0)\n" +
              "METRIC ISSUE_DRAFTS_NEW=\(.drafts.issue_drafts_new // 0)\n" +
              "METRIC ISSUE_DRAFTS_SKIPPED_DEDUPE=\(.drafts.issue_drafts_skipped_dedupe // 0)\n" +
              "METRIC PR_DRAFTS_NEW=\(.drafts.pr_drafts_new // 0)\n" +
              "METRIC PR_DRAFTS_SKIPPED_DEDUPE=\(.drafts.pr_drafts_skipped_dedupe // 0)\n" +
              "METRIC ISSUE_AUTO_CANDIDATES=\(.promotions.issue_auto_candidates // 0)\n" +
              "METRIC ISSUE_CREATED=\(.promotions.issue_created // 0)\n" +
              "METRIC ISSUE_SKIPPED_EXISTING=\(.promotions.issue_skipped_existing // 0)\n" +
              "METRIC ISSUE_CREATE_FAILED=\(.promotions.issue_create_failed // 0)\n" +
              "METRIC BLOCK_HUMAN=\(.promotions.block_human // 0)"
            ' "$OUT/metrics.json"
            echo
            echo "## Actions"
            jq -r '
              if (.actions | length) == 0 then
                "- (none)"
              else
                .actions[] | "- [\(.effective_priority // .priority)] \(.category): \(.action_class) (owner=\(.owner), due=\(.due_hint // "none"), recurrence=\(.recurrence_count // 0))"
              end
            ' "$OUT/metrics.json"
            echo
            echo "## Diff vs Previous"
            jq -r '
              if .diff_skipped then
                "- diff_skipped: \(.reason)"
              else
                "- status_delta: \(.status_delta)\n" +
                "- new_warn_categories: \((.new_warn_categories | join(", ")) // "(none)")\n" +
                "- resolved_warn_categories: \((.resolved_warn_categories | join(", ")) // "(none)")\n" +
                "- new_fail_categories: \((.new_fail_categories | join(", ")) // "(none)")\n" +
                "- resolved_fail_categories: \((.resolved_fail_categories | join(", ")) // "(none)")"
              end
            ' "$OUT/metrics-diff.json"
            echo
            echo "## Draft Proposals"
            jq -r '
              "- issue_drafts: \(.drafts.issue // 0)\n" +
              "- pr_drafts: \(.drafts.pr // 0)\n" +
              "- drafts_summary: artifacts/ops-autopilot/<run>/drafts/summary-actions.md"
            ' "$OUT/metrics.json"
            echo
            echo "## Next CLI"
            echo "1. gcloud run services describe $SERVICE --project $PROJECT_ID --region $REGION --format='value(spec.template.spec.serviceAccountName)'"
            echo "2. gcloud functions list --project $PROJECT_ID --v2 --regions $REGION --format='table(name,buildConfig.runtime,serviceConfig.serviceAccountEmail)'"
            echo "3. gh run list --workflow $VERIFY_WORKFLOW_FILE --limit 5"
          } > "$OUT/summary.md"

          if [ "$status" = "FAIL" ]; then
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$status" = "WARN" ]; then
            echo "status=WARN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=OK" >> "$GITHUB_OUTPUT"

      - name: Upload Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-autopilot-observe-${{ github.run_id }}
          path: ${{ steps.classify.outputs.out }}
          if-no-files-found: error
          retention-days: 30
