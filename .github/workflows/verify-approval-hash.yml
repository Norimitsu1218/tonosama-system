name: verify-approval-hash

on:
  schedule:
    # JST 06:15 (= UTC 21:15 previous day)
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      store_id:
        description: 'Target storeId (optional; if empty, use secrets.DEFAULT_STORE_ID)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-approval-hash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: apicius-6bcae
      REGION: asia-northeast1
      DEFAULT_STORE_ID: ${{ secrets.DEFAULT_STORE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve STORE_ID
        id: resolve_store
        shell: bash
        run: |
          set -euo pipefail
          INPUT_STORE_ID="${{ github.event.inputs.store_id }}"
          STORE_ID="${INPUT_STORE_ID:-${DEFAULT_STORE_ID:-}}"
          if [ -z "${STORE_ID}" ]; then
            echo "[NG] storeId is empty. Set workflow input or secrets.DEFAULT_STORE_ID" >&2
            exit 2
          fi
          echo "store_id=${STORE_ID}" >> "$GITHUB_OUTPUT"
          echo "[OK] STORE_ID resolved"

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set gcloud project
        run: gcloud config set project "$PROJECT_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: npm --prefix functions ci

      - name: Build functions
        run: npm --prefix functions run build

      - name: Verify approval hash chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hash-verify
          TS="$(date -u +%Y%m%d-%H%M%S)"
          STORE_ID="${{ steps.resolve_store.outputs.store_id }}"
          LOG="artifacts/hash-verify/${TS}_${STORE_ID}.log"

          echo "[RUN] storeId=${STORE_ID}" | tee "$LOG"
          if [ -x ops/verify-approval-hash.sh ]; then
            STORE_ID="$STORE_ID" PROJECT_ID="$PROJECT_ID" REGION="$REGION" \
              bash ops/verify-approval-hash.sh 2>&1 | tee -a "$LOG"
          else
            node functions/lib/verifyApprovalHashCli.js "$STORE_ID" 2>&1 | tee -a "$LOG"
          fi

          echo "[OK] verify finished" | tee -a "$LOG"

      - name: Upload verify artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-approval-hash-${{ github.run_id }}
          path: artifacts/hash-verify/*
          if-no-files-found: warn
          retention-days: 30
