name: ai-stack-ci

on:
  pull_request:
    branches: [main-v2]
  push:
    branches: [main-v2]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck:guest
      - run: npm run test:functions
