name: Firebase Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "apps/pwa-guest/**"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "package.json"
      - "package-lock.json"
      - "ops/**"
      - "docs/**"
      - ".github/workflows/firebase-deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-deploy-guest
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
      BASE_URL: ${{ vars.BASE_URL }}
      STORE_ID: ${{ vars.STORE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: CI Preflight
        run: sh ops/ci-preflight.sh

      - name: Guest CI Checks
        run: npm run ci:guest:ssr

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting + Functions
        run: firebase deploy --only hosting:guest,functions --non-interactive

      - name: Post-deploy Health Check
        run: BASE_URL="${BASE_URL}" STORE_ID="${STORE_ID}" sh ops/health.sh

      - name: Verify Approval Hash Chain
        run: STORE_ID="${STORE_ID}" sh ops/verify-approval-hash.sh

      # OIDC migration placeholder (disabled by design):
