name: Runtime Watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-watch
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      STORE_ID: ${{ vars.STORE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime Health Check
        run: BASE_URL="${BASE_URL}" STORE_ID="${STORE_ID}" sh ops/health.sh

      - name: Post Deploy Smoke
        run: BASE_URL="${BASE_URL}" STORE_ID="${STORE_ID}" sh ops/post-deploy-smoke.sh
